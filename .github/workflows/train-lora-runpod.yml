name: Train LoRA on RunPod & Deploy to Hetzner VPS

on:
  workflow_dispatch:
    inputs:
      adapter_name:
        description: 'Target LoRA Workflow Adapter'
        required: true
        type: choice
        options:
          - 'garment_vision'
          - 'trend_scout'
          - 'stylist_chat'
          - 'suitcase'
          - 'scheduled_outfit'
        default: 'garment_vision'
      epochs:
        description: 'Number of Training Epochs'
        required: false
        default: '3'
        type: string
      batch_size:
        description: 'Per-Device Batch Size'
        required: false
        default: '2'
        type: string
      learning_rate:
        description: 'Peak Learning Rate'
        required: false
        default: '2e-4'
        type: string
      gpu_type:
        description: 'Target RunPod GPU Type'
        required: true
        type: choice
        options:
          - 'NVIDIA RTX 4090'
          - 'NVIDIA A40'
          - 'NVIDIA RTX A5000'
          - 'NVIDIA L4'
        default: 'NVIDIA RTX 4090'
      dry_run:
        description: 'Dry Run Mode (Simulate without provisioning GPU)'
        required: false
        type: boolean
        default: false
      deploy_vps:
        description: 'Deploy & hot-reload adapter on Hetzner VPS'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  train-and-deploy:
    name: Headless QLoRA (${{ inputs.adapter_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Runner Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install runpod paramiko huggingface_hub

      - name: Run Headless RunPod Training
        id: runpod-training
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry_run"
          fi

          python training/runpod_driver.py \
            --adapter_name "${{ inputs.adapter_name }}" \
            --epochs "${{ inputs.epochs }}" \
            --batch_size "${{ inputs.batch_size }}" \
            --learning_rate "${{ inputs.learning_rate }}" \
            --gpu_type "${{ inputs.gpu_type }}" \
            --dataset_path "training/datasets/sample_garment_vision.jsonl" \
            --hf_repo "Yoram-Jacobs/dressapp-${{ inputs.adapter_name }}-adapter" \
            $DRY_RUN_FLAG

      - name: Zero-Downtime VPS Deployment via SSH
        if: ${{ inputs.deploy_vps == true && !cancelled() && steps.runpod-training.outcome == 'success' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST || secrets.VPS_SSH_HOST || '178.105.144.142' }}
          VPS_USER: ${{ secrets.VPS_USER || secrets.VPS_SSH_USER || 'root' }}
          VPS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -eo pipefail
          if [ -z "$VPS_SSH_KEY" ]; then
            echo "::warning::No SSH key found in secrets (VPS_SSH_KEY or SSH_PRIVATE_KEY). Skipping automated deployment."
            exit 0
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          SSH_CMD="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          echo "Testing SSH connectivity to Hetzner VPS ($VPS_HOST)..."
          $SSH_CMD ${VPS_USER}@${VPS_HOST} "echo 'Connected successfully to Hetzner VPS host: ' \$(hostname)"

          echo "Triggering zero-downtime adapter sync & reload on VPS..."
          $SSH_CMD ${VPS_USER}@${VPS_HOST} "
            set -eo pipefail
            DEPLOY_SCRIPT=\"/srv/AI-Stylist/deploy/reload_eyes_adapters.sh\"
            if [ ! -f \"\$DEPLOY_SCRIPT\" ]; then
              cd /srv/AI-Stylist && git pull origin main
            fi
            chmod +x \"\$DEPLOY_SCRIPT\"
            bash \"\$DEPLOY_SCRIPT\" \
              --adapter \"${{ inputs.adapter_name }}\" \
              --repo \"Yoram-Jacobs/dressapp-${{ inputs.adapter_name }}-adapter\" \
              --adapters-dir \"/opt/dressApp/adapters\" \
              --token \"${HF_TOKEN}\"
          "
