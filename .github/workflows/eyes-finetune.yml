name: Weekly Eyes Fine-Tuning CI/CD

on:
  schedule:
    # 02:00 UTC every Sunday
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      base_model:
        description: 'Base Gemma-4 Model Identifier'
        required: true
        default: 'google/gemma-4-e4b-it'
        type: choice
        options:
          - 'google/gemma-4-e4b-it'
          - 'google/gemma-4-e2b-it'
      num_epochs:
        description: 'Number of Training Epochs'
        required: false
        default: '3'
      batch_size:
        description: 'Per-Device Training Batch Size'
        required: false
        default: '2'
      learning_rate:
        description: 'Peak Learning Rate'
        required: false
        default: '2e-4'
      compute_backend:
        description: 'Compute Backend for Training'
        required: true
        default: 'runpod'
        type: choice
        options:
          - 'runpod'
          - 'local'
          - 'cpu_dry_run'
      dry_run:
        description: 'Execute complete smoke-test dry-run (no GPU cost)'
        required: false
        type: boolean
        default: false
      push_to_hub:
        description: 'Publish verified checkpoint to Hugging Face Hub'
        required: false
        type: boolean
        default: true
      deploy_vps:
        description: 'Stage passing adapter / GGUF to production Hetzner VPS'
        required: false
        type: boolean
        default: true
      force_training:
        description: 'Force execution even if new item count in database < 500'
        required: false
        type: boolean
        default: false
      min_new_items:
        description: 'Minimum new and approved items threshold in database to trigger training'
        required: false
        default: '500'

permissions:
  contents: write
  packages: write
  issues: write

env:
  HF_REPO: 'Yoram-Jacobs/dressapp-eyes-gguf'
  PYTHON_VERSION: '3.11'

jobs:
  # -------------------------------------------------------------------------
  # Job 1: Dataset Packaging & Normalization
  # -------------------------------------------------------------------------
  prepare-dataset:
    name: Prepare Multimodal SFT Dataset
    runs-on: ubuntu-latest
    outputs:
      should_train: ${{ steps.prep_dataset.outputs.should_train }}
      new_item_count: ${{ steps.prep_dataset.outputs.new_item_count }}
      total_samples: ${{ steps.prep_dataset.outputs.total_samples }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'inference-server/eyes/training/requirements-train.txt'

      - name: Install Training Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r inference-server/eyes/training/requirements-train.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Ingest Database Items & Compile Multimodal SFT Splits
        id: prep_dataset
        env:
          EYES_API_TOKEN: ${{ secrets.EYES_API_TOKEN || secrets.API_TOKEN }}
          MIN_NEW_ITEMS: ${{ inputs.min_new_items || '500' }}
          FORCE_TRAINING: ${{ inputs.force_training || 'false' }}
        run: |
          FORCE_ARG=""
          if [ "$FORCE_TRAINING" = "true" ]; then
            FORCE_ARG="--force"
          fi

          python inference-server/eyes/training/prepare_dataset.py \
            --api-url "https://dressapp.co/api/v1/internal/training-items" \
            --api-token "$EYES_API_TOKEN" \
            --min-new-items "$MIN_NEW_ITEMS" \
            --output-dir build/dataset \
            $FORCE_ARG

      - name: Upload Processed Dataset Artifacts
        if: steps.prep_dataset.outputs.should_train == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eyes-sft-dataset
          path: build/dataset/
          retention-days: 7

  # -------------------------------------------------------------------------
  # Job 2: Headless QLoRA Training & Strict Quality/Regression Gate
  # -------------------------------------------------------------------------
  train-and-evaluate:
    name: Headless QLoRA Training & Regression Gate
    needs: prepare-dataset
    if: needs.prepare-dataset.outputs.should_train == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Training & Evaluation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r inference-server/eyes/training/requirements-train.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Download Processed Dataset
        uses: actions/download-artifact@v4
        with:
          name: eyes-sft-dataset
          path: build/dataset/

      - name: Execute Headless Training
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY || secrets.RUNPOD_KEY }}
          HF_TOKEN: ${{ secrets.EYES_HF_TOKEN || secrets.HF_TOKEN || secrets.HF_WRITE }}
        run: |
          mkdir -p build/adapter build/metrics
          COMPUTE_BACKEND="${{ inputs.compute_backend || 'runpod' }}"
          IS_DRY_RUN="${{ inputs.dry_run || 'false' }}"

          EXTRA_ARGS=""
          if [ "$IS_DRY_RUN" = "true" ] || [ "$COMPUTE_BACKEND" = "cpu_dry_run" ]; then
            EXTRA_ARGS="--dry-run"
          fi

          python inference-server/eyes/training/train_eyes_lora.py \
            --dataset build/dataset/train.jsonl \
            --val-dataset build/dataset/val.jsonl \
            --base-model "${{ inputs.base_model || 'google/gemma-4-e4b-it' }}" \
            --epochs "${{ inputs.num_epochs || 3 }}" \
            --batch-size "${{ inputs.batch_size || 2 }}" \
            --lr "${{ inputs.learning_rate || '2e-4' }}" \
            --backend "$COMPUTE_BACKEND" \
            --output-dir build/adapter \
            --metrics-out build/metrics.json \
            $EXTRA_ARGS

      - name: Run Quality & Regression Gate
        run: |
          python inference-server/eyes/training/evaluate_eyes.py \
            --val-dataset build/dataset/val.jsonl \
            --adapter-dir build/adapter \
            --min-schema-acc 1.0 \
            --min-category-acc 0.95 \
            --min-shoes-acc 1.0 \
            --metrics-out build/metrics.json

      - name: Upload Adapter & Metrics Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eyes-adapter-and-metrics
          path: |
            build/adapter/
            build/metrics.json
          if-no-files-found: warn
          retention-days: 14

  # -------------------------------------------------------------------------
  # Job 3: Merge, GGUF Quantization & Hugging Face Publishing
  # -------------------------------------------------------------------------
  quantize-and-publish:
    name: Quantize GGUF & Publish Checkpoint
    needs: [prepare-dataset, train-and-evaluate]
    if: needs.prepare-dataset.outputs.should_train == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Tooling Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r inference-server/eyes/training/requirements-train.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Download Adapter & Metrics
        uses: actions/download-artifact@v4
        with:
          name: eyes-adapter-and-metrics
          path: build/

      - name: Export Quantized GGUFs
        run: |
          IS_DRY_RUN="${{ inputs.dry_run || 'false' }}"
          EXTRA_ARGS=""
          if [ "$IS_DRY_RUN" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi

          python inference-server/eyes/training/export_gguf.py \
            --adapter-dir build/adapter \
            --output-dir build/gguf \
            --base-model "${{ inputs.base_model || 'google/gemma-4-e4b-it' }}" \
            --quants "Q4_K_M,Q3_K_M" \
            $EXTRA_ARGS

      - name: Publish to Hugging Face Hub
        if: (inputs.push_to_hub != false)
        env:
          HF_TOKEN: ${{ secrets.EYES_HF_TOKEN || secrets.HF_TOKEN || secrets.HF_WRITE }}
        run: |
          RELEASE_TAG="weekly-$(date +'%Y-%m-%d')"
          IS_DRY_RUN="${{ inputs.dry_run || 'false' }}"
          EXTRA_ARGS=""
          if [ "$IS_DRY_RUN" = "true" ] || [ -z "$HF_TOKEN" ]; then
            EXTRA_ARGS="--dry-run"
          fi

          python inference-server/eyes/training/publish_model.py \
            --model-dir build/gguf \
            --repo-id "${{ env.HF_REPO }}" \
            --tag-name "$RELEASE_TAG" \
            --metrics-path build/metrics.json \
            --base-model "${{ inputs.base_model || 'google/gemma-4-e4b-it' }}" \
            $EXTRA_ARGS

      - name: Create GitHub Release
        if: (inputs.push_to_hub != false) && (inputs.dry_run != true)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: weekly-${{ github.run_id }}
          name: "DressApp Eyes Checkpoint (Run #${{ github.run_number }})"
          body_path: build/gguf/README.md
          files: |
            build/gguf/*.json
            build/metrics.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record Training Watermark in DressApp Database
        if: (inputs.dry_run != true)
        env:
          EYES_API_TOKEN: ${{ secrets.EYES_API_TOKEN || secrets.API_TOKEN }}
        run: |
          curl -s -X POST "https://dressapp.co/api/v1/internal/training-watermark" \
            -H "Authorization: Bearer $EYES_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"item_count\": ${{ needs.prepare-dataset.outputs.new_item_count || 0 }}, \"run_id\": \"${{ github.run_id }}\"}" || echo "Watermark ping completed"

      - name: Upload Final Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eyes-release-gguf
          path: build/gguf/
          retention-days: 30

  # -------------------------------------------------------------------------
  # Job 4: Production VPS Staging & Automated Live Hot-Reload Hook
  # -------------------------------------------------------------------------
  stage-to-vps:
    name: Production VPS Staging
    needs: [prepare-dataset, quantize-and-publish]
    if: (needs.prepare-dataset.outputs.should_train == 'true') && (inputs.deploy_vps != false) && (inputs.dry_run != true)
    runs-on: ubuntu-latest
    env:
      VPS_SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY }}
      VPS_HOST: ${{ secrets.VPS_HOST || '178.105.144.142' }}
    steps:
      - name: Download Adapter & GGUF Artifacts
        uses: actions/download-artifact@v4
        with:
          name: eyes-release-gguf
          path: build/gguf/

      - name: Download LoRA Adapter
        uses: actions/download-artifact@v4
        with:
          name: eyes-adapter-and-metrics
          path: build/

      - name: Setup SSH Key
        if: env.VPS_SSH_KEY != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          echo "SSH Key Type & Fingerprint:"
          ssh-keygen -l -f ~/.ssh/deploy_key || echo "::warning::Invalid private key format in secrets"
          echo "SSH Public Key Derived from Secret:"
          ssh-keygen -y -f ~/.ssh/deploy_key || echo "::warning::Failed to derive public key"

      - name: Deploy Checkpoint to Production VPS
        if: env.VPS_SSH_KEY != ''
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          SCP_CMD="scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o BatchMode=yes"

          echo "Testing SSH connectivity to Hetzner VPS ($VPS_HOST)..."
          $SSH_CMD root@$VPS_HOST "echo 'Connected successfully to Hetzner VPS host: ' \$(hostname)"

          echo "Syncing verified adapter to Hetzner VPS (/srv/AI-Stylist/eyes_v4_adapter)..."
          $SSH_CMD root@$VPS_HOST "mkdir -p /srv/AI-Stylist/eyes_v4_adapter /srv/AI-Stylist/eyes_gguf"
          $SCP_CMD -r build/adapter/* root@$VPS_HOST:/srv/AI-Stylist/eyes_v4_adapter/
          $SCP_CMD -r build/gguf/*.gguf root@$VPS_HOST:/srv/AI-Stylist/eyes_gguf/ || true
          echo "Restarting eyes container on VPS..."
          $SSH_CMD root@$VPS_HOST "cd /srv/AI-Stylist/deploy && docker compose restart eyes"

  # -------------------------------------------------------------------------
  # Job 5: Pipeline Status & Metric Summary
  # -------------------------------------------------------------------------
  pipeline-summary:
    name: CI/CD Pipeline Summary
    needs: [prepare-dataset, train-and-evaluate, quantize-and-publish, stage-to-vps]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Compile Workflow Step Summary
        run: |
          echo "## DressApp Eyes Fine-Tuning Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Base Model:** \`${{ inputs.base_model || 'google/gemma-4-e4b-it' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Compute Backend:** \`${{ inputs.compute_backend || 'runpod' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run:** \`${{ inputs.dry_run || 'false' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **New Approved Items in DB:** \`${{ needs.prepare-dataset.outputs.new_item_count || '0' }}\` (Threshold: \`>= ${{ inputs.min_new_items || '500' }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Dataset Preparation:** \`${{ needs.prepare-dataset.result }}\` (should_train: \`${{ needs.prepare-dataset.outputs.should_train || 'false' }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Training & Gate Status:** \`${{ needs.train-and-evaluate.result || 'skipped' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Quantization & Publish Status:** \`${{ needs.quantize-and-publish.result || 'skipped' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Production VPS Staging:** \`${{ needs.stage-to-vps.result || 'skipped' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.prepare-dataset.outputs.should_train }}" != "true" ]; then
            echo "⏸️ **Fine-Tuning Routine Skipped (Scheduling Rule Enforced):**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Only \`${{ needs.prepare-dataset.outputs.new_item_count || '0' }}\` newly added and approved items were found in the DressApp database (< 500 threshold)." >> $GITHUB_STEP_SUMMARY
            echo "Fine-tuning was safely skipped to prevent model weight distortion and overfitting on repeated or insufficiently distinct data." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.train-and-evaluate.result }}" = "success" ]; then
            echo "✅ **All Regression Gates Passed.** Model certified and deployed." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Regression Gate or Training Failed.** Production environment untouched." >> $GITHUB_STEP_SUMMARY
          fi
