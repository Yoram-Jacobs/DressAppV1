services:
  backend:
    ports:
      - "8001:8001"
    environment:
      EYES_PROVIDER: gemma
      EYES_GEMMA_SPACE_URL: http://eyes:7860
      EYES_API_TOKEN: test-token-1234
  frontend:
    build:
      args:
        # Override to point directly to the backend container port
        REACT_APP_BACKEND_URL: http://localhost:8001
    ports:
      - "3000:3000"

  eyes:
    profiles: []
    ports:
      - "7860:7860"
    volumes:
      - ../Eyes-GGUF:/models
    environment:
      EYES_MODEL_FILE: gemma-4-e2b-it.Q4_K_M-002.gguf
      EYES_MMPROJ_FILE: gemma-4-e2b-it.BF16-mmproj.gguf
      EYES_API_TOKEN: test-token-1234
      EYES_LLAMA_THREADS: 4
      LLAMA_BOOT_TIMEOUT_S: 600
