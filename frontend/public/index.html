<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1F6F6B" />
    <meta name="description"
        content="DressApp — your closet, community marketplace, and AI stylist in one. Manage what you own, sell or swap with a 7% community fee, and get outfit advice grounded in your real schedule and weather." />
    <meta name="application-name" content="DressApp" />
    <meta name="apple-mobile-web-app-title" content="DressApp" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
            W3C standard equivalent of the Apple-prefixed tag above.
            Required by Chrome 102+; Chrome now logs a deprecation
            warning if only the apple-prefixed version is present.
            We keep both so iOS Safari (which understands the
            apple- prefix) and Chrome (which prefers the standard
            name) both get the right hint.
        -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>DressApp — closet, marketplace & AI stylist</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Bootstrap 5.3.2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons 1.11.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- font-awesome-icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <!-- Animate.css (used by WOW.js for scroll animations) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css">
    <!-- Swiper Slider CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

    <script>
        /*
         * Suppress the harmless ``DataCloneError`` thrown by some
         * browser extensions when they try to deep-clone the global
         * ``performance`` object across worlds (the
         * ``PerformanceServerTiming`` interface contains
         * non-cloneable fields). Without this, the React error
         * boundary would log a noisy stack trace on every page
         * load.
         */
        window.addEventListener(
            "error",
            function (e) {
                if (
                    e.error instanceof DOMException &&
                    e.error.name === "DataCloneError" &&
                    e.message &&
                    e.message.includes("PerformanceServerTiming")
                ) {
                    e.stopImmediatePropagation();
                    e.preventDefault();
                }
            },
            true,
        );
    </script>
</head>

<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!--
            This HTML file is a template.
            If you open it directly in the browser, you will see an empty page.

            Third-party / vendor branding is intentionally NOT injected
            here. This is DressApp's own customer-facing surface; any
            "powered by" or watermark must be a deliberate product
            decision, not a template leftover.
        -->
    <div id="root"></div>
    <!-- Bootstrap 5.3.2 Bundle with Popper JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- WOW.js (scroll reveal animations, works with Animate.css) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/wow/1.1.2/wow.min.js"></script>
    <!-- Swiper Slider JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</body>

</html>
