# Docker Compose Override for Multi-LoRA DressApp Eyes Service
# Merges into production stack to serve Gemma-4 E4B with dynamic adapter dispatch on port 8080.

services:
  dressApp_eyes:
    build:
      context: .
      dockerfile: Dockerfile
    image: dressapp-eyes:multi-lora
    container_name: dressApp_eyes
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      BASE_MODEL: ${EYES_BASE_MODEL:-google/gemma-4-E4B-it}
      ADAPTERS_DIR: /app/adapters
      INFERENCE_BACKEND: ${EYES_INFERENCE_BACKEND:-auto}
      MAX_LORA_RANK: ${EYES_MAX_LORA_RANK:-64}
      LOAD_IN_4BIT: ${EYES_LOAD_IN_4BIT:-true}
      EYES_API_TOKEN: ${EYES_API_TOKEN:-}
      HF_TOKEN: ${EYES_HF_TOKEN:-${HF_TOKEN:-}}
    volumes:
      # Host-mounted directory for dynamic LoRA weights
      - ./adapters:/app/adapters
      # Shared persistent base model cache
      - eyes-model-cache:/root/.cache/huggingface
      - /srv/AI-Stylist/eyes_gguf:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - dress

volumes:
  eyes-model-cache:
    name: dressapp_eyes-cache

networks:
  dress:
    external: true
    name: dressapp_dress
